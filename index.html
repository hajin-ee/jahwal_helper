<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px 0;box-sizing:border-box;background:#eceff1;font-family:'Noto Sans KR','Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:#363636}
.box{background:#fff;border:1px solid #cfd6d9;border-top:4px solid #0a5566;padding:28px 36px 24px;width:min(400px,92vw);box-sizing:border-box}
.logo{display:block;height:34px;margin:0 0 20px}
.ver{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;color:#038091;border:1px solid #9fc9cf;border-radius:10px;padding:1px 8px;vertical-align:3px}
.who{display:block;font-size:12px;font-weight:700;color:#038091;margin-bottom:3px}
.who i{font-style:normal;font-weight:400;color:#6b8a8f;margin-left:4px}
.warn{margin:0 0 16px;padding:10px 12px;background:#fff4cc;border-left:4px solid #e6a100;color:#6b4a00;font-size:13px;line-height:1.55}
.runner{position:relative;width:min(400px,92vw);height:70px;overflow:visible;clip-path:inset(-80px 0 0 0);margin-bottom:-2px}
.runner::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(90deg,#0a5566 0 8px,#038091 8px 16px)}
.guy{position:absolute;bottom:6px;left:-40px;width:36px;height:36px}
.guy svg{position:absolute;inset:0;width:36px;height:36px}
.guy .f2{visibility:hidden;animation:step2 .3s steps(1) infinite}.guy .f1{animation:step1 .3s steps(1) infinite}
@keyframes step1{0%{visibility:visible}50%{visibility:hidden}}
@keyframes step2{0%{visibility:hidden}50%{visibility:visible}}
@keyframes run{0%{left:-40px}100%{left:calc(100% + 4px)}}
.doc{position:absolute;bottom:14px;width:14px;height:17px;background:#fff;border:2px solid #0a5566;border-radius:1px;box-shadow:inset 0 3px 0 #fff,inset 0 4px 0 #9fc9cf,inset 0 7px 0 #fff,inset 0 8px 0 #9fc9cf,inset 0 11px 0 #fff,inset 0 12px 0 #9fc9cf;animation:float 1.4s ease-in-out infinite;transition:transform .25s,opacity .25s}
.doc::before{content:"";position:absolute;right:-2px;top:-2px;border:4px solid #038091;border-left-color:transparent;border-bottom-color:transparent}
.doc.got{animation:none;transform:translateY(-14px) scale(1.5) rotate(15deg);opacity:0}
@keyframes float{50%{transform:translateY(-3px)}}
.pop{position:absolute;bottom:40px;z-index:2;transform:translateX(-50%);font-size:14px;font-weight:800;color:#0a5566;white-space:nowrap;pointer-events:none;animation:pop 1.2s ease-out forwards;letter-spacing:-.01em;text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff}
.pop.up{color:#d6453d}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}25%{transform:translate(-50%,-2px) scale(1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
.guy.jump{transform:translateY(-8px);transition:transform .12s}
.bubble{animation:bob 2.4s ease-in-out infinite;transform-origin:30px 100%}
.bubble.hop{animation:hop .45s ease-out}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes hop{0%{transform:scale(1)}35%{transform:scale(1.07) rotate(-2deg)}70%{transform:scale(.98)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.guy{left:16px}.guy .f2{display:none}.guy .f1{animation:none}.doc,.bubble{animation:none}}
.wrap{display:flex;flex-direction:column;align-items:center}
.talk{display:flex;align-items:flex-end;gap:6px;margin:0 0 -4px;width:min(400px,92vw)}
.mascot{width:92px;height:auto;flex:none;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.mascot{animation:none}}
.bubble{position:relative;background:#fff;color:#0a5566;font-weight:700;font-size:16px;padding:12px 16px;border-radius:16px;line-height:1.45;border:2px solid #0a5566;margin-bottom:8px}
.bubble::before{content:"";position:absolute;left:28px;bottom:-12px;border:10px solid transparent;border-top-color:#0a5566;border-bottom:0}
.bubble::after{content:"";position:absolute;left:30px;bottom:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
h1{font-size:20px;margin:0 0 6px;color:#0a5566}p{margin:0 0 18px;color:#666;font-size:14px}
label{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
input{width:100%;box-sizing:border-box;font:inherit;font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-size:16px;padding:10px 12px;border:1px solid #b9c6c9;border-radius:4px}
input:focus{outline:2px solid #038091;border-color:#038091}
button{margin-top:14px;width:100%;font:inherit;font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-size:16px;font-weight:700;padding:11px;border:0;border-radius:4px;background:#038091;color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}#msg{min-height:20px;margin-top:10px;font-size:14px;color:#d6453d}
small{display:block;margin-top:14px;color:#999;font-size:12px}

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c));
  const html=new TextDecoder().decode(pt);
  try{ sessionStorage.setItem("jahwal.gate",pw); }catch(e){}
  document.open(); document.write(html); document.close();
}

(function(){ const R=document.querySelector(".runner"); if(!R) return; const G=R.querySelector(".guy"), docs=[...R.querySelectorAll(".doc")], B=document.querySelector(".bubble"), C=document.getElementById("cnt");
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const lay=()=>docs.forEach(d=>d.style.left=(R.clientWidth*+d.dataset.x-7)+"px"); lay(); addEventListener("resize",lay);
  if(still) return;
  const DUR=6000; let t0=performance.now(), got=new Set(), score=0;
  const say=(d,i)=>{ const p=document.createElement("div"); p.className="pop"+(i===2?" up":""); p.textContent=(i===2?"♥ ":"▼ ")+d.dataset.t; p.style.left=(parseFloat(d.style.left)+7)+"px"; R.appendChild(p); setTimeout(()=>p.remove(),1250);
    B.classList.remove("hop"); void B.offsetWidth; B.classList.add("hop"); G.classList.add("jump"); setTimeout(()=>G.classList.remove("jump"),140); };
  (function tick(now){ let k=(now-t0)/DUR; if(k>=1){ t0=now; k=0; got.clear(); docs.forEach(d=>d.classList.remove("got")); }
    const W=R.clientWidth, x=-40+k*(W+44); G.style.left=x+"px";
    docs.forEach((d,i)=>{ if(!got.has(i)&&x+30>=parseFloat(d.style.left)){ got.add(i); d.classList.add("got"); say(d,i); } });
    requestAnimationFrame(tick); })(t0);
})();
document.getElementById("f").onsubmit=async e=>{ e.preventDefault(); const b=document.getElementById("go"), m=document.getElementById("msg");
  b.disabled=true; m.textContent=""; try{ await open_(document.getElementById("pw").value); }catch(err){ m.textContent="비밀번호가 맞지 않습니다."; b.disabled=false; document.getElementById("pw").select(); } };
(async()=>{ let pw=null; try{ pw=sessionStorage.getItem("jahwal.gate"); }catch(e){} if(pw){ try{ await open_(pw); }catch(e){ try{ sessionStorage.removeItem("jahwal.gate"); }catch(_){} } } })();
